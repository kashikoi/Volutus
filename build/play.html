<!doctype html>
<html lang="en" class="day">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Volutus — be a cloud</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=2026.10.31.2" />
  <link rel="apple-touch-icon" href="icon.svg?v=2026.10.31.2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=2026.10.31.2" />
  <script>
    (function () {
      try {
        var themes = ["day", "twilight", "night"];
        var pref = localStorage.getItem("volutus_theme") || "day";
        var mode = themes.indexOf(pref) >= 0 ? pref : (sessionStorage.getItem("volutus_active_theme") || "day");
        document.documentElement.className = themes.indexOf(mode) >= 0 ? mode : "day";
      } catch (e) {}
    })();
  </script>
</head>
<body class="pad">
  <div class="pad-sky" aria-hidden="true"></div>

  <main class="screen" id="joinScreen">
    <div class="brand brand--center">
      <svg class="brand__emblem" viewBox="0 0 64 40" aria-hidden="true">
        <path d="M6 28c0-6 5-11 11-11 1-6 7-11 14-11 6 0 11 3 13 8 1 0 2-1 4-1 6 0 10 5 10 10 0 5-4 9-9 9H14c-4 0-8-2-8-4Z" fill="currentColor" opacity=".95"/>
        <path d="M10 30c10 3 34 3 46-1" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand__name">Volutus</div>
        <div class="brand__tag">become a cloud</div>
      </div>
    </div>
    <form class="join-form glass" id="joinForm" autocomplete="off">
      <label class="field">
        <span>Room code</span>
        <input id="roomInput" class="room-input" maxlength="4" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" required />
      </label>
      <label class="field">
        <span>Your cloud's name</span>
        <input id="nameInput" maxlength="16" autocorrect="off" spellcheck="false" placeholder="Nimbo" required />
      </label>
      <p class="error" id="joinError" hidden></p>
      <button type="submit" class="btn btn--primary btn--big" id="joinBtn">Float up</button>
    </form>
    <p class="muted center">The room code is on the big screen.</p>
  </main>

  <main class="screen screen--play" id="playScreen" hidden>
    <header class="pad-top">
      <div class="me">
        <span class="me__swatch" id="meSwatch"></span>
        <div>
          <div class="me__name" id="meName">Cloud</div>
          <div class="me__sub"><span id="meColor">Joining</span> · room <span class="mono" id="meRoom"></span></div>
          <div class="gauge" id="gauge" title="Water"><div class="gauge__fill" id="gaugeFill"></div></div>
        </div>
      </div>
      <div class="status status--compact" id="status" data-state="connecting"><span class="status__dot"></span></div>
      <button type="button" class="icon-btn" id="leaveBtn" title="Leave">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="stick-area" id="stickArea" aria-label="Drag to steer your cloud">
      <div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div>
      <p class="stick-hint" id="stickHint">Drag anywhere to steer</p>
    </section>

    <footer class="pad-bottom">
      <button type="button" class="btn tilt-btn" id="tiltBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5" transform="rotate(-14 12 12)" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span id="tiltLabel">Tilt</span>
      </button>
      <button type="button" class="rain-btn" id="rainBtn" aria-pressed="false">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 22a9 9 0 0 1 17-5 7 7 0 0 1 9 7 6 6 0 0 1-6 6H14a6 6 0 0 1-2-8Z" fill="currentColor"/><path d="M16 35l-2 5M24 35l-2 5M32 35l-2 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span id="rainLabel">Hold to rain</span>
      </button>
    </footer>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay__card glass">
        <p id="overlayText"></p>
        <button type="button" class="btn" id="overlayBtn" hidden></button>
      </div>
    </div>
  </main>

  <script src="js/util.js?v=2026.10.31.2"></script>
  <script src="js/net.js?v=2026.10.31.2"></script>
  <script src="js/controller.js?v=2026.10.31.2"></script>
</body>
</html>
